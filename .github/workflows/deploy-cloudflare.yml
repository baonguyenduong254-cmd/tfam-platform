name: Deploy TFAM to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Cloudflare Worker name (default: through-frost-and-myth)'
        required: false
        default: 'through-frost-and-myth'
      d1_database_name:
        description: 'Personal D1 database name (default: tfam-content)'
        required: false
        default: 'tfam-content'

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check Cloudflare deployment secrets
        id: check_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not yet configured (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID). Skipping deploy."
          fi

      - name: Setup Node.js 22
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        if: steps.check_secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        if: steps.check_secrets.outputs.ready == 'true'
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test suite
        if: steps.check_secrets.outputs.ready == 'true'
        working-directory: site
        run: |
          npx tsc --noEmit
          node --test tests/*.test.mjs

      - name: Build production bundle
        if: steps.check_secrets.outputs.ready == 'true'
        working-directory: site
        run: pnpm run build

      - name: Prepare standalone Cloudflare Worker config
        if: steps.check_secrets.outputs.ready == 'true'
        working-directory: site
        env:
          CF_WORKER_NAME: ${{ inputs.worker_name || 'through-frost-and-myth' }}
          CF_D1_DATABASE_NAME: ${{ inputs.d1_database_name || 'tfam-content' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Deploy to Cloudflare Workers
        if: steps.check_secrets.outputs.ready == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.cloudflare.json

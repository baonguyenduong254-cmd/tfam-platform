name: Prepare TFAM 210
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task/update-210-foundation
      - name: Vendor pinned skills and audit source without executing upstream code
        run: python3 tools/prepare210.py
      - name: Save results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c task/update-210-results
          git add .agents third_party maintenance references
          git diff --cached --check -- . ':!.agents' ':!third_party'
          git commit -m 'Prepare pinned AI skills and source cleanup audit for 210'
          git push origin HEAD:refs/heads/task/update-210-results
